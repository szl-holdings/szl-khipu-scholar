[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-khipu-scholar"
version = "0.1.0"
description = "Provenance-first khipu corpus, OKR-derived QA dataset, and signed-receipt verification for the SZL governed-AI estate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SZL Holdings" }]
keywords = ["khipu", "governed-ai", "receipts", "dsse", "huggingface", "provenance"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
verify = ["szl-mesh>=0.1.0", "pynacl>=1.5", "huggingface_hub>=0.30"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "huggingface_hub>=0.30"]

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-khipu-scholar"
Repository = "https://github.com/szl-holdings/szl-khipu-scholar"
Documentation = "https://github.com/szl-holdings/szl-khipu-scholar/tree/main/docs"

[tool.setuptools.packages.find]
include = ["szl_khipu_scholar*"]

[tool.setuptools.package-data]
szl_khipu_scholar = ["trust/*.json"]
